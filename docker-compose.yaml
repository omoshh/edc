services:
  db:
    image: postgres:15-alpine
    container_name: edc_db
    env_file: .env 
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: omoshh/edc-backend:latest
    container_name: edc_backend
    privileged: true
    env_file: .env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy 
    volumes:
      - /proc:/proc:ro
    restart: unless-stopped

  frontend:
    image: omoshh/edc-frontend:latest
    container_name: edc_frontend
    env_file: .env
    environment:
      - STREAMLIT_SERVER_PORT=${APP_PORT:-8501}
      - STREAMLIT_SERVER_ADDRESS=${APP_ADDRESS:-0.0.0.0}
    ports:
      - "${APP_PORT:-8501}:${APP_PORT:-8501}"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: