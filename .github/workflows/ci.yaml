name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: omoshh/edc-backend

permissions:
  contents: read

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f frontend/requirements.txt ]; then pip install -r frontend/requirements.txt; fi
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          pytest test/
  build:
    runs-on: ubuntu-latest
    needs: lint_test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  update-gitops:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v6
        with:
          repository: omoshh/gitops-lab
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
      - name: Change image tag
        run: |
          sed -i -E "s|(image:[[:space:]]*).*edc-backend.*|\1ghcr.io/omoshh/edc-backend:sha-${GITHUB_SHA}|" apps/edc-monitor/backend-deployment.yaml
          grep -q "ghcr.io/omoshh/edc-backend:sha-${GITHUB_SHA}" apps/edc-monitor/backend-deployment.yaml \
            || { echo "::error::image line not updated"; exit 1; }
      - name: Commit and push
        run: |
          git config user.name "ci-bot"
          git config user.email "cibot@placeholder.mail"
          git add -A
          git diff --cached --quiet && { echo "no change, skipping"; exit 0; }
          git commit -m "chore: bump edc-backend to sha-${GITHUB_SHA}"
          git push
